<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48"><style>.body{transform-box:fill-box;transform-origin:50% 0}.bell{transform-box:fill-box;transform-origin:50% 100%}.tent{transform-box:fill-box;transform-origin:50% 0}.halo,.star{transform-box:fill-box;transform-origin:50% 50%}.body{animation:bob 1.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}.tent{animation:swing 0.9s ease-in-out infinite}.t2{animation-delay:-.3s}.t3{animation-delay:-.6s}.t4{animation-delay:-.9s}@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bell{animation:pulse 0.9s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1,1)}35%{transform:scale(1.07,.9)}}.glow{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:0.3}50%{opacity:0.65}}.halo{animation:halo .8s ease-out 1 forwards}@keyframes halo{from{transform:scale(.55);opacity:1}to{transform:scale(1.5);opacity:0}}.bub{animation:rise 2.4s ease-in infinite;opacity:0}.b2{animation-delay:-.8s}.b3{animation-delay:-1.6s}@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-12px);opacity:0}}.ink{animation:ink 1.2s ease-in-out infinite;opacity:0}.i2{animation-delay:.2s}.i3{animation-delay:.4s}@keyframes ink{0%,100%{opacity:0}50%{opacity:.9}}.z{animation:zz 3s ease-in-out infinite;opacity:0}@keyframes zz{0%{transform:translate(0,0);opacity:0}40%{opacity:.8}100%{transform:translate(3px,-8px);opacity:0}}.star{animation:twinkle 1.6s ease-in-out 1 forwards;opacity:0}.s2{animation-delay:.15s}.s3{animation-delay:.3s}.s4{animation-delay:.45s}@keyframes twinkle{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.2) rotate(60deg);opacity:1}100%{transform:scale(0) rotate(120deg);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><radialGradient id="g" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#d97757" stop-opacity=".9"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/></radialGradient><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab4a3"/><stop offset="1" stop-color="#d97757"/></linearGradient></defs><circle class="glow" cx="24" cy="21" r="22" fill="url(#g)" opacity="0.45"/><g><g class="body"><path class="tent t1" d="M14.5 23q-2 5 0 9q2 4 0 8" stroke="#d97757" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/><path class="tent t2" d="M20 23q-2 5 0 9q2 4 0 8" stroke="#d97757" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/><path class="tent t3" d="M28 23q-2 5 0 9q2 4 0 8" stroke="#d97757" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/><path class="tent t4" d="M33.5 23q-2 5 0 9q2 4 0 8" stroke="#d97757" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/><g class="bell"><path d="M9.5 23C9.5 9.5 38.5 9.5 38.5 23Q35 26 31.5 23Q27.75 26 24 23Q20.25 26 16.5 23Q13 26 9.5 23Z" fill="url(#b)" stroke="#a35941" stroke-width=".7"/><ellipse cx="17.5" cy="14.5" rx="3" ry="1.8" fill="#fff" opacity=".45" transform="rotate(-20 17.5 14.5)"/><circle cx="20" cy="18" r="1.6" fill="#2b2b3a"/><circle cx="28" cy="18" r="1.6" fill="#2b2b3a"/><circle cx="20.5" cy="17.4" r=".55" fill="#fff"/><circle cx="28.5" cy="17.4" r=".55" fill="#fff"/><circle cx="16.6" cy="20.6" r="1.5" fill="#ff8fa3" opacity=".5"/><circle cx="31.4" cy="20.6" r="1.5" fill="#ff8fa3" opacity=".5"/><path d="M22.6 20.6q1.4 1.2 2.8 0" stroke="#2b2b3a" stroke-width=".9" fill="none" stroke-linecap="round"/></g></g></g></svg>
